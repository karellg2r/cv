<style>
:root{--bg:#F5F5F2;--surface:#fff;--ink:#17201C;--muted:#66706B;--line:#E2E3DE;--accent:#2F4A3F;--soft:#E4ECE6;--on-accent:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--surface:#1A1F1C;--ink:#EEF1EE;--muted:#9AA39E;--line:#2B312D;--accent:#9FC5B1;--soft:#1F2A24;--on-accent:#111513}}
:root[data-theme="dark"]{--bg:#111513;--surface:#1A1F1C;--ink:#EEF1EE;--muted:#9AA39E;--line:#2B312D;--accent:#9FC5B1;--soft:#1F2A24;--on-accent:#111513}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.rv{opacity:1!important;transform:none!important}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:12px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:700;text-decoration:none;letter-spacing:-.02em;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px}
nav{display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
nav a:hover{color:var(--ink)}nav a.on{background:var(--accent);color:var(--on-accent)}
@media(max-width:640px){.brand{display:none}nav{flex:1}}
.hero{padding:56px 0 64px;position:relative}
.hero::before{content:"";position:absolute;inset:-40px -20% auto auto;width:420px;height:420px;background:radial-gradient(circle,var(--soft),transparent 70%);z-index:-1;pointer-events:none}
.portrait{width:104px;height:104px;border-radius:32px;object-fit:cover;object-position:50% 20%;display:block;margin-bottom:28px;border:1px solid var(--line);box-shadow:0 12px 32px -12px rgba(0,0,0,.25)}
h1{font-size:clamp(2.8rem,9vw,5rem);line-height:1;letter-spacing:-.045em;font-weight:700;margin:0 0 20px}
.role{font-size:clamp(1.15rem,3vw,1.45rem);color:var(--muted);margin:0 0 28px;line-height:1.45;max-width:30em;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.search{max-width:56ch;margin:0 0 20px}
.more{max-width:56ch;margin:0 0 32px}
.more summary{cursor:pointer;list-style:none;display:inline-flex;gap:8px;font-weight:600;font-size:15px;color:var(--accent)}
.more summary::-webkit-details-marker{display:none}.more summary::after{content:"+"}.more[open] summary::after{content:"–"}
.more p{margin:14px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--surface);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(0,0,0,.3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
section{padding:64px 0}
h2{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700;letter-spacing:-.035em;margin:0 0 12px;line-height:1.1}
.intro{margin:0 0 32px;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}
.card h3{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.card p{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
.card .proof{margin-top:12px;color:var(--ink);font-size:15px;padding-top:12px;border-top:1px solid var(--line)}
.proofs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
@media(max-width:640px){.proofs{grid-template-columns:1fr}}
.proofs div{background:var(--accent);color:var(--on-accent);border-radius:24px;padding:26px;font-size:15px;line-height:1.45}
.proofs strong{display:block;font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-bottom:6px}
.timeline details{background:var(--surface);border:1px solid var(--line);border-radius:24px;margin-bottom:12px;padding:0 26px}
.timeline summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto 20px;gap:16px;align-items:baseline;padding:22px 0}
.timeline summary::-webkit-details-marker{display:none}
.what{font-weight:700;letter-spacing:-.01em}.where{display:block;font-weight:400;color:var(--muted);font-size:15px}
.when{color:var(--muted);font-size:14px;text-align:right}
.plus{width:12px;height:12px;position:relative;justify-self:end;align-self:center}
.plus::before,.plus::after{content:"";position:absolute;background:var(--ink);transition:transform .25s}
.plus::before{left:0;right:0;top:5.5px;height:1.5px}.plus::after{top:0;bottom:0;left:5.5px;width:1.5px}
details[open] .plus::after{transform:scaleY(0)}
.timeline ul{margin:0;padding:0 0 24px 18px;color:var(--muted);font-size:16px}.timeline li{margin:0 0 8px}
@media(max-width:520px){.timeline summary{grid-template-columns:1fr 20px}.when{grid-column:1;text-align:left;grid-row:2}.plus{grid-row:1;grid-column:2}}
.rows .row{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.rows .row:last-child{border-bottom:1px solid var(--line)}
.t{font-weight:700}.s{color:var(--muted);font-size:15px;display:block;font-weight:400}.d{color:var(--muted);font-size:15px;white-space:nowrap}
.lbl{margin:48px 0 14px;font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.cert{margin-bottom:12px}
.cert .head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.cert .badge{background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.cert .meta{color:var(--muted);font-size:14px;margin:0 0 10px}
.cert .code{margin-top:10px;font-size:13px;color:var(--muted);word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.tag span{color:var(--muted);font-weight:400}
.word{max-width:56ch;margin:0 0 32px}.word p{margin:0 0 14px}.word .sign{color:var(--muted)}
.big{font-size:clamp(1.3rem,5vw,2rem);letter-spacing:-.03em;font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent);word-break:break-word}
.links{margin:24px 0 0;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 22px}
.cta{background:var(--accent);color:var(--on-accent);border-radius:32px;padding:clamp(28px,6vw,48px)}
.cta .intro{color:inherit;opacity:.85}.cta .btn{border-color:transparent;color:var(--ink)}.cta .btn.primary{background:var(--on-accent);color:var(--accent)}
.exchange-note{margin:16px 0 0;font-size:14px;opacity:.8;max-width:52ch}
footer{padding:32px 0;color:var(--muted);font-size:14px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}

const $ = (id) => document.getElementById(id);

$("hero").innerHTML = `
  <img class="portrait" src="${C.photo}" alt="Portrait de ${C.name}">
  <h1>${C.name}</h1>
  <p class="role">${C.role}</p>
  <div class="chips">${C.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
  <p class="search">${C.searchText}</p>
  <details class="more"><summary>Lire ma démarche</summary>${C.searchMore.map(t => `<p>${t}</p>`).join("")}</details>
  <div class="actions"><a class="btn primary" href="#echanger">Me contacter</a><a class="btn" href="#parcours">Voir mon expérience</a></div>`;

$("postes").innerHTML = `<h2>${C.postsTitle}</h2><p class="intro">${C.postsIntro}</p>

$("footer").textContent = C.name;

const ids = ["postes","softskills","parcours","formation","contact"];
const links = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.dataset.s === e.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });
ids.forEach(id => io.observe($(id)));
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const ro = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); } }), { threshold: .08 });
  document.querySelectorAll(".card,.proofs div,.timeline details,.cta").forEach(el => { el.classList.add("rv"); ro.observe(el); });
}
